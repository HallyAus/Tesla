name: Release

# Creates a GitHub Release (and its tag) for the version declared in the
# Tesla Tracker manifest. Runs automatically when that version changes on main,
# or on demand via "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - custom_components/tesla_tracker/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: ver
        run: echo "version=$(jq -r .version custom_components/tesla_tracker/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          NOTES="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              BEGIN { f = 0 }
              /^## \[/ { if (f) exit; if (index($0, "[" v "]")) { f = 1 } }
              f { print }
            ' CHANGELOG.md > "$NOTES" || true
          fi
          if [ ! -s "$NOTES" ]; then
            echo "Tesla Companion $TAG" > "$NOTES"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Tesla Companion $TAG" \
            --notes-file "$NOTES"
          echo "Created release $TAG"
