name: Release

# Creates a GitHub Release (and its tag) for the version declared in the
# Tesla Tracker manifest. Runs automatically when that version changes on main,
# or on demand via "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - custom_components/tesla_tracker/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashcam-viewer/package-lock.json

      - name: Rebuild and sync the dashcam viewer panel
        # Keep the committed custom_components/tesla_tracker/panel/ bundle in sync
        # with the viewer source so the tagged release never ships a stale panel.
        run: bash scripts/build_panel.sh

      - name: Commit refreshed panel bundle if it changed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- custom_components/tesla_tracker/panel; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add custom_components/tesla_tracker/panel
            git commit -m "chore: sync dashcam viewer panel bundle for release"
            git push origin HEAD:main
          else
            echo "Panel bundle already up to date."
          fi

      - name: Read manifest version
        id: ver
        run: echo "version=$(jq -r .version custom_components/tesla_tracker/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          NOTES="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              BEGIN { f = 0 }
              /^## \[/ { if (f) exit; if (index($0, "[" v "]")) { f = 1 } }
              f { print }
            ' CHANGELOG.md > "$NOTES" || true
          fi
          if [ ! -s "$NOTES" ]; then
            echo "Tesla Companion $TAG" > "$NOTES"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Tesla Companion $TAG" \
            --notes-file "$NOTES"
          echo "Created release $TAG"
