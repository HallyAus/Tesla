name: Dashcam Viewer CI

on:
  push:
    paths:
      - "apps/dashcam-viewer/**"
      - "scripts/build_panel.sh"
      - ".github/workflows/viewer.yml"
  pull_request:
    paths:
      - "apps/dashcam-viewer/**"
      - "scripts/build_panel.sh"
      - ".github/workflows/viewer.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/dashcam-viewer

jobs:
  build-test:
    name: Build, test and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashcam-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Verify the HA panel bundle builds and uses relative asset paths
        # The committed custom_components/tesla_tracker/panel/ bundle must build
        # cleanly with relative (./assets/...) URLs so it works from HA's static
        # mount. Hashed filenames change per build, so we assert relativity, not
        # an exact diff. The release workflow re-syncs and commits the bundle.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash scripts/build_panel.sh
          grep -q './assets/' custom_components/tesla_tracker/panel/index.html
          echo "Panel index.html references assets relatively."
