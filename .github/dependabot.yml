version: 2
updates:
  # Dashcam Viewer (npm)
  - package-ecosystem: npm
    directory: /apps/dashcam-viewer
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - dashcam-viewer

  # Tesla Tracker test dependencies (pip)
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - tesla-tracker

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
